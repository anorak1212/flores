<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>flores | universo de flores</title>
    <script>
      // Alto REAL de la pantalla (--vh): corrige el bug de las barras de
      // navegación en móviles. Script definitivo del señor, adaptado.
      (function () {
        'use strict';
        function ajustarDimensiones() {
          var altoReal = window.innerHeight || document.documentElement.clientHeight;
          document.documentElement.style.setProperty('--vh', altoReal * 0.01 + 'px');
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', ajustarDimensiones);
        } else {
          ajustarDimensiones();
        }
        window.addEventListener('resize', ajustarDimensiones, { passive: true });
        window.addEventListener('orientationchange', ajustarDimensiones, { passive: true });
        window.addEventListener('load', function () {
          setTimeout(ajustarDimensiones, 150);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
